# Render Blueprint — نشر Laravel من GitHub مع Docker
# https://render.com/docs/blueprint-spec
#
# بعد ربط GitHub:
# 1. Dashboard → New → Blueprint → اختر هذا المستودع
# 2. أضف APP_KEY و JWT_SECRET و متغيرات قاعدة البيانات
# 3. سيتم النشر تلقائياً باستخدام Dockerfile

services:
  - type: web
    name: zinou-tv-api
    plan: free
    dockerfile: ./Dockerfile
    envVars:
      - key: APP_NAME
        value: ZINOU TV
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        sync: false
      - key: APP_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: X_API_KEY
        sync: false
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MYSQL_ATTR_SSL_CA
        value: /etc/ssl/certs/ca-certificates.crt
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
